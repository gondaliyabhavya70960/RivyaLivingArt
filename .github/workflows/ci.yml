name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger. Added because there was no way to run CI on demand while
  # diagnosing an Actions outage — every run had to be provoked by a push or a PR,
  # which is a slow way to test whether runners are available at all.
  # Note: GitHub only offers this for workflows present on the default branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # The database gates run against a real PostgreSQL, in the SAME job as everything else.
    #
    # This is a deliberate cost decision, not an accident of layout. A separate job would pay a
    # second runner startup and a second `npm ci` — roughly doubling the minutes this workflow
    # spends — to buy parallelism the run is too short to need. As one job with a service
    # container, the database adds well under a minute to a run that already takes about three.
    #
    # postgres:16 matches the local development version. Supabase hosts a different minor, so this
    # proves the migrations apply to PostgreSQL 16, not that they apply to a specific Supabase
    # build; the difference has not mattered for anything in the Phase 03 schema, which uses no
    # Supabase-specific SQL beyond the auth.users reference the shim provides.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rivya
        ports:
          - 5432:5432
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Loopback, so scripts/db/reset.mjs runs without --allow-remote. It refuses any other host,
      # which is what stops a misconfigured workflow from resetting a real database.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rivya

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each check is its own step so a red run names the failure without reading a log.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # THE UNIT PROJECT ONLY. `DATABASE_URL` is set for the whole job so the database gates below
      # can run, and `vitest run` would therefore also run the RLS project — against a database
      # that has no migrations yet, since `db:reset` is a later step. Every RLS suite would fail
      # with "relation does not exist". The RLS project runs at the end of the job, after the
      # migrations and the seed, with RLS_TESTS_REQUIRED so a skip is a failure there.
      - name: Unit tests
        run: npm run test:unit

      # --- media gates (CANONICAL-DECISIONS D6, amendment A1) ---
      - name: Manifest is deterministic
        run: npm run manifest:verify

      - name: No colliding asset IDs
        run: npm run media:check-ids

      # The second asset guard required by Phase 07's exit criteria. It reads the master plan's
      # briefs and fails if any targets an asset the manifest already holds — the failure that
      # spends credits regenerating a picture we own.
      - name: Nothing in the manifest is regenerated
        run: npm run media:assert-no-regen

      # The status document is generated. A hand-edit, or a manifest rebuild without a
      # regeneration, shows up here as a diff rather than as a document that quietly stops
      # describing the library.
      - name: Asset status document is up to date
        run: npm run media:check-status

      # The twelve status edges live in lib/cms/transitions.ts and the trigger is rendered from
      # them. This fails if the SQL and the TypeScript disagree — which matters because the SQL is
      # the copy an API caller actually hits, and the one nobody opens.
      - name: CMS status transitions match their SQL
        run: npm run cms:check-transitions

      # No marketing copy in a public section renderer. The rule is CLAUDE.md's; this parses every
      # file under components/sections/ with the TypeScript compiler and fails on a literal a
      # visitor would read. Added with the gate in Phase 08, widened in Phase 10 to cover the site
      # chrome under components/patterns/ — the header, footer and announcement bar render words a
      # visitor reads just as a section does.
      - name: No visitor-readable literals in section renderers or chrome
        run: npm run cms:check-copy

      # --- public site gates (Phase 10) ---
      #
      # One 'use client' at the top of a public layout turns the whole site into a client bundle,
      # and the failure appears three files away from the cause. The WhatsApp gate closes the two
      # holes a type cannot: a hand-written wa.me href, and buildDirectContactUrl imported onto a
      # conversion surface where D1 requires the enquiry to be persisted first.
      - name: Server Components by default on the public site
        run: npm run site:check-client-boundary

      - name: Every WhatsApp link goes through lib/whatsapp
        run: npm run site:check-whatsapp
      - name: Viewer bundle gate (Phase 21) — no three in any first-load client graph
        run: npm run perf:check-bundle

      # --- design-system gates (Phase 02) ---
      - name: Token discipline
        run: npm run design:check-tokens

      - name: Component registry
        run: npm run design:check-registry

      - name: No dead utility classes
        run: npm run design:check-utilities

      # --- database gates (Phase 03) ---
      # `psql` is pre-installed on ubuntu-latest, so no apt step is needed.
      - name: Migrations apply to an empty database
        run: npm run db:reset

      - name: Migrations are forward-only and carry no content
        run: npm run db:check-migrations

      - name: Schema invariants (RLS, column tiers, D10 gates)
        run: npm run db:check-schema

      - name: Generated types match the database
        run: npm run db:check-types

      # Proves the seeding contract end to end on a fresh database: every record inserts, then
      # every record updates and none inserts. A regression in the hashing makes the second run
      # insert or skip instead, which no unit test with a fake client could catch.
      #
      # THE COUNTS ARE DERIVED, NOT WRITTEN DOWN. This step used to grep for `updated  7`, the
      # number of taxonomy records at the time. Phase 08 added two seed modules and took the total
      # to 25, so the literal became wrong the moment the seed grew — a green-looking assertion
      # that would have failed for a reason unrelated to the contract it exists to prove. What is
      # actually invariant is that the second run updates exactly what the first run inserted, and
      # inserts nothing; that survives every future module.
      - name: Seed is idempotent
        run: |
          set -euo pipefail
          npm run seed:content 2>&1 | tee /tmp/seed-first.txt
          npm run seed:content 2>&1 | tee /tmp/seed-second.txt

          first_inserted=$(sed -n 's/^  inserted  *\([0-9][0-9]*\)$/\1/p' /tmp/seed-first.txt)
          second_inserted=$(sed -n 's/^  inserted  *\([0-9][0-9]*\)$/\1/p' /tmp/seed-second.txt)
          second_updated=$(sed -n 's/^  updated  *\([0-9][0-9]*\)$/\1/p' /tmp/seed-second.txt)
          second_unchanged=$(sed -n 's/^  unchanged  *\([0-9][0-9]*\)$/\1/p' /tmp/seed-second.txt)

          # Guards the parser itself: an output shape change that made every capture empty would
          # otherwise compare '' to '' and pass while proving nothing.
          #
          # THE SECOND RUN REPORTS `unchanged`, NOT `updated`. Phase 09 gave the runner a fourth
          # steady-state outcome — a row the runner still owns whose content is byte-identical is
          # left alone, so a re-seed does not append a no-op revision to every section — and this
          # step kept asserting the pre-Phase-09 shape. What the contract actually says: the
          # second run inserts nothing, rewrites nothing, and finds every row it wrote unchanged.
          test -n "$first_inserted" && test "$first_inserted" -gt 0
          test "$second_inserted" = '0'
          test "$second_updated" = '0'
          test "$second_unchanged" = "$first_inserted"
          grep -q 'skipped (owner edit)  0' /tmp/seed-second.txt

      # SEED §54's audit, generated from the database. A seed that changed what is in there and did
      # not regenerate this shows up as a diff rather than as a document that quietly stopped
      # describing reality — the same shape as media:check-status, for the same reason.
      - name: Content inventory is up to date
        run: npm run content:check-inventory

      # --- the build, against the database this job has just migrated and seeded ---
      #
      # `next build` pre-renders the public site, and pre-rendering reads content: every static
      # route's page data, `generateStaticParams` on the dynamic routes, the sitemap. The
      # application speaks HTTP to PostgREST, never SQL to PostgreSQL, so the service container
      # alone is not enough, and there is no NEXT_PUBLIC_SUPABASE_URL here to point it at. The
      # first build ever to execute on this repository (run 152) died collecting page data for
      # /collections/[slug] on exactly that.
      #
      # So the build runs against the PostgREST Supabase itself runs, over the database above,
      # through scripts/db/local-rest.mjs — the tool Phase 10 built for running the site without
      # a Supabase project. It mints a throwaway JWT secret per run; no hosted project is
      # involved and no repository secret is needed. What the build sees is what the seed wrote,
      # which is what a fresh deployment sees. It sits here, after the seed and the inventory
      # check, because that is the state a build should read: the owner-edit step below changes
      # a row on purpose, and the migration-runner step works in a database of its own.
      #
      # The binary is pinned by version and checksum. The checksum is of the release asset as
      # downloaded on 2026-09-10 and run locally to validate this step; a changed asset fails
      # here rather than running.
      - name: Install PostgREST (pinned)
        env:
          POSTGREST_VERSION: v13.0.4
          POSTGREST_SHA256: a0052c8d4726f52349e0298f98da51140ef4941855548590ee88331afa617811
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgrest"
          curl -sSfL -o "$RUNNER_TEMP/postgrest/postgrest.tar.xz" \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz"
          echo "${POSTGREST_SHA256}  $RUNNER_TEMP/postgrest/postgrest.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/postgrest/postgrest.tar.xz" -C "$RUNNER_TEMP/postgrest"
          "$RUNNER_TEMP/postgrest/postgrest" --version

      - name: Build against the seeded database
        env:
          POSTGREST_BIN: ${{ runner.temp }}/postgrest/postgrest
          LOCAL_REST_PORT: '3001'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          node scripts/db/local-rest.mjs > /tmp/local-rest.log 2>&1 &
          rest_pid=$!
          trap 'kill "$rest_pid" 2>/dev/null || true' EXIT

          # PostgREST answers its root with the OpenAPI document once the schema cache is loaded
          # and with 503 before that; the gateway in front answers 502 until PostgREST listens at
          # all. Either would fail the build's first query, so wait for the 200.
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3001/rest/v1/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3001/rest/v1/

          # The shim prints the two variables for the caller to put in front of a command. The key
          # is a throwaway signed with a secret minted for this run only, so reading it from the
          # log is the intended use, not a leak.
          anon_key=$(sed -n 's/^ *NEXT_PUBLIC_SUPABASE_ANON_KEY=\(.*\) \\$/\1/p' /tmp/local-rest.log)
          test -n "$anon_key"

          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:3001 \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key" \
          npm run build

      # Runs on the real output of the build above. .next/static is what ships to browsers.
      - name: No service-role key in the client bundle
        run: npm run security:check-bundle

      # Proves the rule the whole seed runner exists for: an owner's edit is never overwritten.
      - name: Seeding does not overwrite an owner edit
        run: |
          psql "$DATABASE_URL" -c "update categories set name = 'Owner Edit' where slug = 'furniture';"
          npm run seed:content 2>&1 | tee /tmp/seed-third.txt
          grep -q 'skipped (owner edit)  1' /tmp/seed-third.txt
          test "$(psql "$DATABASE_URL" -Atc "select name from categories where slug='furniture';")" = 'Owner Edit'

      # db:migrate is the script that will touch the REAL project (db-migrate.yml). db:reset never
      # will — it drops schema public. They are different code paths, so proving reset works proves
      # nothing about migrate, and migrate's failure modes are the expensive ones.
      #
      # Runs against its own throwaway database because the one above has already been reset: a
      # forward-only runner meeting a fully-built schema with no ledger would try to re-create
      # every object, which tests nothing that could happen in production.
      - name: The forward-only migration runner works, and refuses what it should
        env:
          BOOTSTRAP_URL: postgresql://postgres:postgres@127.0.0.1:5432/rivya
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rivya_migrate_check
        run: |
          set -euo pipefail
          psql "$BOOTSTRAP_URL" -q -c 'create database rivya_migrate_check;'
          # The auth shim, because a bare PostgreSQL has no auth.users. Hosted Supabase does, which
          # is why db:migrate itself never applies this.
          psql "$DATABASE_URL" -q --set ON_ERROR_STOP=1 -f supabase/local/00-auth-shim.sql

          echo '--- plan must not change anything ---'
          npm run db:migrate
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_tables where schemaname='public';")" = '1'

          echo '--- apply ---'
          npm run db:migrate -- --apply

          echo '--- second run must be a no-op ---'
          npm run db:migrate -- --apply | tee /tmp/migrate-2.txt
          grep -q 'nothing to do' /tmp/migrate-2.txt

          echo '--- an edited migration must be refused, not silently ignored ---'
          printf '\n-- edited after apply\n' >> supabase/migrations/0004_taxonomy.sql
          if npm run --silent db:migrate -- --apply > /tmp/migrate-drift.txt 2>&1; then
            echo 'FAIL: an edited migration was accepted'; cat /tmp/migrate-drift.txt; exit 1
          fi
          grep -q 'EDITED AFTER BEING APPLIED' /tmp/migrate-drift.txt
          git checkout -- supabase/migrations/0004_taxonomy.sql

          echo '--- the proxy convention is intact ---'
          npm run security:check-proxy

      - name: No queries outside the repository layer
        run: npm run db:check-data-layer

      # The migration set must apply where it is actually going, not only where it was written.
      # Hosted Supabase projects keep citext/unaccent/pg_trgm in an `extensions` schema, where
      # `create extension if not exists` is a no-op — which made the whole Phase 03 set fail at
      # 0003 against a real project while every local check passed.
      - name: Migrations apply under the hosted extension layout
        run: npm run db:check-hosted-layout

      # --- auth and RLS gates (Phase 04) ---
      # Two drift gates, asking different questions. The first proves the MIGRATION matches the
      # permission matrix; the second proves the DATABASE does. A migration can be correct and
      # never applied, and a database can drift from the migration that made it.
      - name: RLS policies match the permission matrix
        run: npm run auth:check-policies

      - name: The database's policies match the matrix
        run: npm run auth:check-rls

      # RLS_TESTS_REQUIRED turns "no database" into a hard failure rather than a skip. A silently
      # skipped security suite reports success while proving nothing — which is exactly what
      # happened once during Phase 04, when a fixture wipe tripped the last-owner trigger and the
      # suite reported 62 skipped for several runs while still looking green.
      - name: RLS behaves as the matrix says, per role
        run: npm run test
        env:
          RLS_TESTS_REQUIRED: '1'
